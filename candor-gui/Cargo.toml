[package]
name = "candor-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
candor-core = { version = "0.1.0", path = "../candor-core" }
chrono = "0.4.45"
ego-tree = "0.11.1"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_5", "gtk_v4_10"] }
psl = "2.1.57"
relm4 = { version = "0.11.0", features = ["libadwaita"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
toml = "1.1.8"
ureq = "3.5.0"
url = "2.5.8"
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }
