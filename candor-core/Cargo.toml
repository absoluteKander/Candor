[package]
name = "candor-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
csv = "1.3.1"
dirs = "7.0.0"
hickory-resolver = "0.26.3"
imap = { version = "2.4.1", features = ["native-tls"] }
infer = "0.22.0"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-auth = "0.13.3"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
native-tls = "0.2.18"
oauth2 = { version = "5.0.0", default-features = false }
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "fs", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
ureq = "3.5.0"
url = "2.5.8"
zeroize = "1.9.1"
